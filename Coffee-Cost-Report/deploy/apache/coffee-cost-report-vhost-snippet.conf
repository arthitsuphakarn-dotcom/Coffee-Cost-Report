# Coffee Cost Report — บล็อกที่ต้องแทรกเข้าไปใน <VirtualHost *:443> ของ cpr-one.com
# (ไฟล์นี้ไม่ใช่ vhost เดี่ยว ๆ ห้าม a2ensite)
#
# วางไว้ใกล้ ๆ Alias ของแอปอื่น เช่นต่อจากบล็อก /technician_pm/ui
# แล้ว: sudo apache2ctl configtest && sudo systemctl reload apache2
#
# mod_proxy / mod_proxy_http เปิดอยู่แล้ว (บล็อก /phpMyAdmin/ ใช้อยู่)

    # --- Coffee Cost Report (Next.js, systemd: coffee-cost-report, port 3000) ---
    #
    # ProxyPass แบบไม่มี trailing slash ครอบทั้ง /coffee-cost-report และทุก path
    # ข้างใต้ — Next (basePath) จะ 308 จาก ".../coffee-cost-report/" มาที่แบบไม่มี
    # slash เอง และ ProxyPassReverse จะแก้ Location header ให้กลับเป็นโดเมนจริง
    ProxyPass        /coffee-cost-report  http://127.0.0.1:3000/coffee-cost-report
    ProxyPassReverse /coffee-cost-report  http://127.0.0.1:3000/coffee-cost-report

    # การเข้าถึง: แอปตรวจ session ของ CPR-one เอง (cookie cpr_one_session กับตาราง
    # cpr_one.user_sessions — proxy.ts + lib/auth/session.ts) ไม่ต้องใช้ Basic Auth
    # ต้องตั้ง CPR_ONE_DB_* ใน .env.local ไม่อย่างนั้นทุกคนจะถูกส่งกลับไปหน้า login
    # --- end Coffee Cost Report ---
